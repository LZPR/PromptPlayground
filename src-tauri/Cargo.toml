[package]
name = "prompt-playground"
version = "0.1.0"
description = "A transparent local AI chat client"
authors = ["Prompt Playground"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "prompt_playground_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "prompt-playground"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
